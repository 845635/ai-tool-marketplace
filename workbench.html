<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI工作台 - 工作流编辑器 | AI工具超市</title>
  <meta name="description" content="可视化AI工作流编辑器，拖拽节点构建自动化工作流，支持导入导出。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="workbench">

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🤖</span>
        AI工具超市
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="category.html">全部工具</a></li>
        <li><a href="workbench.html" class="active">工作台</a></li>
        <li><a href="about.html">关于我们</a></li>
      </ul>
      <div class="nav-right">
        <div class="token-balance" title="点击查看余额/充值">
          <span class="token-icon">💎</span>
          <span class="token-amount">0</span>
        </div>
        <button class="token-recharge-btn" onclick="openRechargeModal()">充值</button>
      </div>
      <button class="mobile-menu-btn" aria-label="菜单">☰</button>
    </div>
  </nav>

  <!-- 工作台主体 -->
  <div class="workbench-page">
    
    <!-- 工具栏 -->
    <div class="workbench-toolbar">
      <div class="toolbar-left">
        <button class="toolbar-btn" onclick="toggleWorkflowList()" title="我的工作流">
          📁 我的工作流
        </button>
        <input type="text" class="workflow-name-input" id="workflowNameInput" value="未命名工作流" placeholder="工作流名称">
      </div>
      <div class="toolbar-right">
        <button class="toolbar-btn" onclick="createNewWorkflow()" title="新建工作流">
          🆕 新建
        </button>
        <button class="toolbar-btn" onclick="saveWorkflowToList()" title="保存工作流">
          💾 保存
        </button>
        <button class="toolbar-btn" onclick="document.getElementById('importWorkflowInput').click()" title="导入工作流">
          📥 导入
        </button>
        <input type="file" id="importWorkflowInput" accept=".json" style="display:none">
        <button class="toolbar-btn" onclick="exportWorkflow()" title="导出工作流">
          📤 导出
        </button>
        <button class="toolbar-btn" onclick="toggleRunLog()" title="运行日志">
          📋 日志
        </button>
        <button class="toolbar-btn primary" onclick="runWorkflow()" title="运行工作流">
          ▶️ 运行
        </button>
      </div>
    </div>

    <!-- 主区域 -->
    <div class="workbench-main">
      
      <!-- 左侧节点面板 -->
      <div class="node-panel" id="nodePanel">
        <!-- JS渲染节点列表 -->
      </div>

      <!-- 中间画布 -->
      <div class="workflow-canvas-container" id="workflowCanvasContainer">
        <div class="workflow-canvas" id="workflowCanvas">
          <!-- 节点和连线由JS渲染 -->
        </div>
        <!-- 缩放控制 -->
        <div class="canvas-zoom-controls">
          <button class="zoom-btn" onclick="zoomCanvas(-0.1)" title="缩小">−</button>
          <span class="zoom-level" id="zoomDisplay">100%</span>
          <button class="zoom-btn" onclick="zoomCanvas(0.1)" title="放大">+</button>
          <button class="zoom-btn" onclick="resetCanvasView()" title="重置视图" style="font-size:11px">⟲</button>
        </div>
        <!-- 画布提示 -->
        <div class="canvas-hint">
          💡 Ctrl+滚轮缩放 | 空格+拖拽平移 | Delete删除选中
        </div>
      </div>

      <!-- 右侧属性面板 -->
      <div class="property-panel" id="propertyPanel">
        <h3>节点属性</h3>
        <div class="property-empty">
          <div class="icon">👆</div>
          <p>请选择一个节点<br>查看和编辑属性</p>
        </div>
      </div>

    </div>
  </div>

  <!-- 工作流列表面板 -->
  <div class="workflow-list-panel" id="workflowListPanel">
    <div class="workflow-list-header">
      <h3>📁 我的工作流</h3>
      <button class="modal-close" onclick="toggleWorkflowList(false)">✕</button>
    </div>
    <div class="workflow-list-content" id="workflowListContent">
      <!-- JS渲染 -->
    </div>
  </div>

  <!-- 运行日志面板 -->
  <div class="run-log-panel" id="runLogPanel">
    <div class="run-log-header">
      <h4>📋 运行日志</h4>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="toolbar-btn" style="padding:4px 10px;font-size:11px" onclick="clearRunLog()">清空</button>
        <button class="modal-close" onclick="toggleRunLog(false)">✕</button>
      </div>
    </div>
    <div class="run-log-content" id="runLogContent">
      <!-- 日志由JS添加 -->
    </div>
  </div>

  <script src="data/tools-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
